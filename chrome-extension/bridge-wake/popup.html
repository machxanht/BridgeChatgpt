<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bridge Wake</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 360px; background: #020617; color: #e2e8f0; }
    .wrap { padding: 14px; }
    .hero { border: 1px solid rgba(139,92,246,.35); background: linear-gradient(135deg, rgba(124,58,237,.2), rgba(8,47,73,.22)); border-radius: 18px; padding: 14px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .logo { width:38px; height:38px; border-radius:13px; display:grid; place-items:center; font-weight:900; background:#7c3aed; color:white; box-shadow:0 10px 30px rgba(124,58,237,.25); }
    h1 { font-size:15px; margin:0; color:white; }
    .sub { font-size:11px; color:#94a3b8; margin-top:2px; }
    .status { display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; }
    .pill { font-size:10px; font-weight:800; padding:5px 8px; border-radius:999px; border:1px solid rgba(52,211,153,.28); background:rgba(16,185,129,.1); color:#a7f3d0; }
    .toggle { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; }
    .card { margin-top:10px; border:1px solid rgba(255,255,255,.09); background:rgba(15,23,42,.72); border-radius:15px; padding:12px; }
    .card h2 { font-size:11px; margin:0 0 9px; color:#c4b5fd; text-transform:uppercase; letter-spacing:.08em; }
    label { display:block; font-size:10px; color:#94a3b8; margin:8px 0 5px; }
    input[type="text"], select { width:100%; border:1px solid rgba(255,255,255,.1); background:#020617; color:#f8fafc; padding:8px 9px; border-radius:10px; outline:none; font-size:11px; }
    input[type="text"]:focus, select:focus { border-color:rgba(139,92,246,.55); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .checkrow { margin-top:9px; display:flex; align-items:center; gap:7px; font-size:11px; color:#cbd5e1; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    button { border:0; border-radius:11px; padding:9px 10px; font-weight:850; font-size:11px; cursor:pointer; }
    #wakeNow { background:#7c3aed; color:white; }
    #resetDelivered { background:rgba(255,255,255,.08); color:#cbd5e1; border:1px solid rgba(255,255,255,.08); }
    button:disabled { opacity:.5; cursor:wait; }
    .metric { display:grid; grid-template-columns:1fr auto; gap:8px; font-size:11px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .metric:last-child { border-bottom:0; }
    .metric span:first-child { color:#94a3b8; }
    .good { color:#86efac; }
    .bad { color:#fda4af; }
    .log { margin-top:8px; max-height:120px; overflow:auto; display:flex; flex-direction:column; gap:5px; }
    .logitem { font-size:9px; line-height:1.35; color:#94a3b8; background:rgba(2,6,23,.65); border-radius:8px; padding:6px 7px; }
    .hint { margin-top:9px; font-size:9px; line-height:1.45; color:#64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <h1>Bridge Wake</h1>
          <div class="sub">Bridge có việc → đúng tab tự thức</div>
        </div>
      </div>
      <div class="status">
        <span class="pill" id="statePill">● ĐANG THEO DÕI</span>
        <label class="toggle"><input type="checkbox" id="enabled" /> Bật tự động</label>
      </div>
    </section>

    <section class="card">
      <h2>⚙️ Lịch đánh thức</h2>
      <label for="bridgeUrl">Bridge URL</label>
      <input type="text" id="bridgeUrl" />
      <div class="row">
        <div>
          <label for="intervalMinutes">Kiểm tra mỗi</label>
          <select id="intervalMinutes">
            <option value="0.5">30 giây</option>
            <option value="1">1 phút</option>
            <option value="2">2 phút</option>
            <option value="5">5 phút</option>
          </select>
        </div>
        <div>
          <label for="redeliveryMinutes">Nếu chưa nhận, thử lại</label>
          <select id="redeliveryMinutes">
            <option value="5">5 phút</option>
            <option value="10">10 phút</option>
            <option value="20">20 phút</option>
            <option value="30">30 phút</option>
          </select>
        </div>
      </div>
      <label class="checkrow"><input type="checkbox" id="focusOnWake" /> Đưa tab lên trước khi gửi prompt</label>
      <div class="buttons">
        <button id="wakeNow">⚡ KIỂM TRA NGAY</button>
        <button id="resetDelivered">↻ Cho phép wake lại</button>
      </div>
    </section>

    <section class="card">
      <h2>📡 Trạng thái</h2>
      <div class="metric"><span>Lần kiểm tra cuối</span><b id="lastRunAt">—</b></div>
      <div class="metric"><span>Tab vừa đánh thức</span><b id="lastWakeCount">0</b></div>
      <div class="metric"><span>Lỗi</span><b id="lastError" class="good">Không</b></div>
      <div class="log" id="log"></div>
      <div class="hint">Chrome có thể chạy alarm định kỳ nhưng không tự bật máy đang sleep. Nếu ChatGPT/Studio đổi giao diện, selector gửi prompt có thể cần cập nhật.</div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
