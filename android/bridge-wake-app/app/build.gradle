plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bridge.wake'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bridge.wake'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.4.7'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Build stamp: v0.4.7 Chrome-tab reuse + Studio internal-error recovery.
