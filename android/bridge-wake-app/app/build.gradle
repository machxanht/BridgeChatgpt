plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bridge.wake'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bridge.wake'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.4.6'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

