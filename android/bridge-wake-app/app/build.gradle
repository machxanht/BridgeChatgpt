plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bridge.wake'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bridge.wake'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.4.8'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Build stamp: v0.4.8 idle gate + stale prompt cleanup + one wake per logical task.
