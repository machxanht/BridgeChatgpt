name: Bridge Android Recovery v0.5.2 Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-recovery-v052.mjs'
      - '.github/workflows/android-recovery-v052-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-android-recovery-v052-hotfix
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic recovery patch
        run: node .github/scripts/patch-recovery-v052.mjs

      - name: Verify diff
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          grep -q 'versionCode 16' android/bridge-wake-app/app/build.gradle
          grep -q "versionName '0.5.2'" android/bridge-wake-app/app/build.gradle
          grep -q 'STATE_RECOVER_RESTORE' android/bridge-wake-app/app/src/main/java/com/bridge/wake/BridgeAccessibilityService.java
          grep -q 'recoveryActionInFlight' android/bridge-wake-app/app/src/main/java/com/bridge/wake/BridgeAccessibilityService.java
          grep -q 'recovery_restore_after_refresh' android/bridge-wake-app/app/src/main/java/com/bridge/wake/BridgeAccessibilityService.java

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p android/bridge-wake-app :app:assembleDebug --stacktrace
          cp android/bridge-wake-app/app/build/outputs/apk/debug/app-debug.apk bridge.apk
          test -s bridge.apk

      - name: Remove one-shot machinery
        run: |
          git rm -f .github/scripts/patch-recovery-v052.mjs
          git rm -f .github/workflows/android-recovery-v052-hotfix.yml

      - name: Commit verified recovery hotfix
        run: |
          set -euo pipefail
          git config user.name 'Bridge ChatGPT'
          git config user.email 'bridge-chatgpt@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(android): restore same Studio task after paced recovery refresh'
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-android-apk-v0.5.2
          path: bridge.apk
          if-no-files-found: error
          retention-days: 30
