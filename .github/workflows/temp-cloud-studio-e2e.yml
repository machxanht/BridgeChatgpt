name: Temp Cloud Studio E2E

on:
  pull_request:
    branches: [main]

jobs:
  review-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Review TASK-2 after ChatGPT GitHub apply
        shell: bash
        env:
          BASE: https://bridgechatgpt-production.up.railway.app
          TASK_ID: TASK-2
        run: |
          set -euo pipefail
          echo 'STEP approve_review'
          node -e "process.stdout.write(JSON.stringify({decision:'approve',summary:'ChatGPT connector applied the Studio artifact to GitHub test branch and verified the resulting blob.',tests_verified:true,reviewer:'chatgpt'}))" \
            | curl -fsS -X POST "$BASE/api/tasks/$TASK_ID/review" -H "Origin: $BASE" -H 'Content-Type: application/json' --data-binary @- \
            | tee /tmp/review.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/review.json','utf8')); if(d.status!=='completed') { console.error(d); process.exit(2) }; console.log('E2E_REVIEW_PASS task_id='+d.id+' status='+d.status)"

          echo 'STEP final_task'
          curl -fsS -H "Origin: $BASE" "$BASE/api/tasks/$TASK_ID" | tee /tmp/task.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/task.json','utf8')); if(d.status!=='completed') { console.error(d); process.exit(3) }; console.log('E2E_CLOUD_LOOP_PASS task_id='+d.id)"
