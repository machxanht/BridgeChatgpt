name: Apply PC executor pairing bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-pairing-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add secure pairing and Windows bootstrap
        shell: bash
        run: |
          cat > server/executorPairing.ts <<'TS'
          import crypto from 'crypto';
          import fs from 'fs';
          import path from 'path';

          export interface PairedExecutorAuth {
            node_id: string;
            workspace_id: string;
            project_id: string;
          }

          interface PairingRecord {
            pairing_id: string;
            code_hash: string;
            workspace_id: string;
            project_id: string;
            created_at: string;
            expires_at: string;
            used_at: string | null;
          }

          interface TokenRecord extends PairedExecutorAuth {
            token_hash: string;
            created_at: string;
            revoked_at: string | null;
          }

          interface PairingStore {
            version: 1;
            pairings: PairingRecord[];
            tokens: TokenRecord[];
          }

          const ID_RE = /^[a-zA-Z0-9._:-]{3,160}$/;
          const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          let writeTail: Promise<void> = Promise.resolve();

          function storePath() {
            return path.resolve(process.cwd(), process.env.BRIDGE_EXECUTOR_AUTH_STORE_PATH || 'data/executor-auth.json');
          }

          function emptyStore(): PairingStore {
            return { version: 1, pairings: [], tokens: [] };
          }

          function readStore(): PairingStore {
            const file = storePath();
            if (!fs.existsSync(file)) return emptyStore();
            try {
              const parsed = JSON.parse(fs.readFileSync(file, 'utf8')) as PairingStore;
              if (parsed?.version !== 1 || !Array.isArray(parsed.pairings) || !Array.isArray(parsed.tokens)) return emptyStore();
              return parsed;
            } catch {
              return emptyStore();
            }
          }

          function writeStore(store: PairingStore) {
            const file = storePath();
            fs.mkdirSync(path.dirname(file), { recursive: true });
            const tmp = `${file}.${process.pid}.${Date.now()}.tmp`;
            fs.writeFileSync(tmp, JSON.stringify(store, null, 2) + '\n', { mode: 0o600 });
            fs.renameSync(tmp, file);
          }

          async function withWriteLock<T>(fn: () => Promise<T> | T): Promise<T> {
            let release!: () => void;
            const previous = writeTail;
            writeTail = new Promise<void>((resolve) => { release = resolve; });
            await previous;
            try {
              return await fn();
            } finally {
              release();
            }
          }

          function safeId(value: unknown, label: string) {
            const id = String(value || '').trim();
            if (!ID_RE.test(id)) throw new Error(`${label} is invalid`);
            return id;
          }

          function normalizeCode(value: unknown) {
            return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
          }

          function hash(value: string) {
            return crypto.createHash('sha256').update(value).digest('hex');
          }

          function generateCode() {
            const bytes = crypto.randomBytes(8);
            let raw = '';
            for (let i = 0; i < 8; i += 1) raw += CODE_ALPHABET[bytes[i] % CODE_ALPHABET.length];
            return `${raw.slice(0, 4)}-${raw.slice(4)}`;
          }

          function cleanup(store: PairingStore, now = Date.now()) {
            store.pairings = store.pairings.filter((item) => {
              const expires = Date.parse(item.expires_at);
              const used = item.used_at ? Date.parse(item.used_at) : NaN;
              if (item.used_at && Number.isFinite(used) && now - used > 24 * 60 * 60_000) return false;
              if (!item.used_at && Number.isFinite(expires) && now - expires > 24 * 60 * 60_000) return false;
              return true;
            });
          }

          export async function issueExecutorPairing(input: {
            workspace_id: string;
            project_id: string;
            ttl_ms?: number;
          }) {
            return withWriteLock(async () => {
              const store = readStore();
              cleanup(store);
              const workspaceId = safeId(input.workspace_id, 'workspace_id');
              const projectId = safeId(input.project_id, 'project_id');
              const ttl = Math.max(60_000, Math.min(Number(input.ttl_ms || 10 * 60_000), 30 * 60_000));
              let code = generateCode();
              while (store.pairings.some((item) => item.code_hash === hash(normalizeCode(code)) && !item.used_at)) code = generateCode();
              const now = new Date();
              const record: PairingRecord = {
                pairing_id: `PAIR-${Date.now().toString(36)}-${crypto.randomBytes(3).toString('hex')}`,
                code_hash: hash(normalizeCode(code)),
                workspace_id: workspaceId,
                project_id: projectId,
                created_at: now.toISOString(),
                expires_at: new Date(now.getTime() + ttl).toISOString(),
                used_at: null,
              };
              store.pairings.push(record);
              writeStore(store);
              return {
                pairing_id: record.pairing_id,
                code,
                workspace_id: workspaceId,
                project_id: projectId,
                expires_at: record.expires_at,
              };
            });
          }

          export async function redeemExecutorPairing(input: { code: string; node_id: string }) {
            return withWriteLock(async () => {
              const store = readStore();
              cleanup(store);
              const normalized = normalizeCode(input.code);
              if (normalized.length !== 8) throw new Error('Pairing code is invalid');
              const nodeId = safeId(input.node_id, 'node_id');
              const codeHash = hash(normalized);
              const record = store.pairings.find((item) => item.code_hash === codeHash && !item.used_at);
              if (!record) throw new Error('Pairing code is invalid or already used');
              if (Date.parse(record.expires_at) <= Date.now()) throw new Error('Pairing code expired');

              record.used_at = new Date().toISOString();
              for (const token of store.tokens) {
                if (token.node_id === nodeId && !token.revoked_at) token.revoked_at = record.used_at;
              }
              const rawToken = `bex_${crypto.randomBytes(32).toString('base64url')}`;
              store.tokens.push({
                token_hash: hash(rawToken),
                node_id: nodeId,
                workspace_id: record.workspace_id,
                project_id: record.project_id,
                created_at: record.used_at,
                revoked_at: null,
              });
              writeStore(store);
              return {
                token: rawToken,
                node_id: nodeId,
                workspace_id: record.workspace_id,
                project_id: record.project_id,
              };
            });
          }

          export function verifyPairedExecutorToken(rawToken: string): PairedExecutorAuth | null {
            const token = String(rawToken || '').trim();
            if (!token.startsWith('bex_') || token.length < 24) return null;
            const store = readStore();
            const tokenHash = hash(token);
            const found = store.tokens.find((item) => item.token_hash === tokenHash && !item.revoked_at);
            if (!found) return null;
            return { node_id: found.node_id, workspace_id: found.workspace_id, project_id: found.project_id };
          }

          export async function resetExecutorPairingStoreForTests() {
            await withWriteLock(async () => {
              const file = storePath();
              try { fs.unlinkSync(file); } catch { /* ignore */ }
            });
          }
          TS

          cat > server/executorRoutes.ts <<'TS'
          import { NextFunction, Request, Response, Router } from 'express';
          import { isSameOriginBrowserRequest, verifyToken } from './auth.js';
          import { issueExecutorPairing, redeemExecutorPairing, verifyPairedExecutorToken, type PairedExecutorAuth } from './executorPairing.js';
          import {
            cancelExecutorJob,
            claimExecutorJob,
            completeExecutorJob,
            createExecutorJob,
            getExecutorJob,
            getExecutorSnapshot,
            heartbeatExecutorNode,
            registerExecutorNode,
          } from './executorStore.js';

          export const executorRouter = Router();

          type ExecutorRequestAuth =
            | { kind: 'browser' | 'main' | 'legacy' | 'open' }
            | { kind: 'paired'; pairing: PairedExecutorAuth };

          function readPresentedExecutorToken(req: Request) {
            const explicit = req.headers['x-bridge-executor-token'];
            if (typeof explicit === 'string' && explicit.trim()) return explicit.trim();
            const auth = req.headers.authorization || '';
            const [scheme, token] = auth.split(' ');
            if (token && (scheme === 'Bearer' || scheme === 'Token')) return token;
            return '';
          }

          function requestAuth(req: Request): ExecutorRequestAuth | undefined {
            return (req as any).executorAuth as ExecutorRequestAuth | undefined;
          }

          function requirePairingIssuer(req: Request, res: Response, next: NextFunction) {
            const mainToken = String(process.env.BRIDGE_MCP_TOKEN || '').trim();
            if (isSameOriginBrowserRequest(req) || (mainToken && verifyToken(req))) {
              next();
              return;
            }
            res.status(401).json({ ok: false, error: 'Pairing codes can only be created from the Bridge UI or an authenticated Bridge agent.' });
          }

          executorRouter.post('/pairing-codes', requirePairingIssuer, async (req: Request, res: Response) => {
            try {
              const pairing = await issueExecutorPairing({
                workspace_id: req.body?.workspace_id,
                project_id: req.body?.project_id,
                ttl_ms: req.body?.ttl_ms,
              });
              res.status(201).json({ ok: true, ...pairing });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/pair', async (req: Request, res: Response) => {
            try {
              const paired = await redeemExecutorPairing({ code: req.body?.code, node_id: req.body?.node_id });
              res.json({ ok: true, ...paired });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          function requireExecutorAccess(req: Request, res: Response, next: NextFunction) {
            const executorToken = String(process.env.BRIDGE_EXECUTOR_TOKEN || '').trim();
            const mainToken = String(process.env.BRIDGE_MCP_TOKEN || '').trim();
            if (isSameOriginBrowserRequest(req)) {
              (req as any).executorAuth = { kind: 'browser' } satisfies ExecutorRequestAuth;
              next();
              return;
            }
            if (mainToken && verifyToken(req)) {
              (req as any).executorAuth = { kind: 'main' } satisfies ExecutorRequestAuth;
              next();
              return;
            }
            const presented = readPresentedExecutorToken(req);
            if (executorToken && presented === executorToken) {
              (req as any).executorAuth = { kind: 'legacy' } satisfies ExecutorRequestAuth;
              next();
              return;
            }
            const pairing = presented ? verifyPairedExecutorToken(presented) : null;
            if (pairing) {
              (req as any).executorAuth = { kind: 'paired', pairing } satisfies ExecutorRequestAuth;
              next();
              return;
            }
            if (!executorToken && !mainToken) {
              (req as any).executorAuth = { kind: 'open' } satisfies ExecutorRequestAuth;
              next();
              return;
            }
            res.status(401).json({
              ok: false,
              error: 'Unauthorized executor client. Pair this PC from Bridge or provide a valid executor token.',
            });
          }

          function enforcePairedScope(req: Request, input: { node_id?: unknown; workspace_id?: unknown; project_id?: unknown }) {
            const auth = requestAuth(req);
            if (!auth || auth.kind !== 'paired') return;
            if (input.node_id != null && String(input.node_id) !== auth.pairing.node_id) throw new Error('Paired token belongs to another PC node');
            if (input.workspace_id != null && String(input.workspace_id) !== auth.pairing.workspace_id) throw new Error('Paired token belongs to another workspace');
            if (input.project_id != null && String(input.project_id) !== auth.pairing.project_id) throw new Error('Paired token belongs to another project');
          }

          function requireController(req: Request) {
            const auth = requestAuth(req);
            if (auth?.kind === 'paired') throw new Error('PC worker tokens cannot queue or cancel jobs');
          }

          executorRouter.use(requireExecutorAccess);

          executorRouter.get('/snapshot', async (req: Request, res: Response) => {
            try {
              const auth = requestAuth(req);
              const paired = auth?.kind === 'paired' ? auth.pairing : null;
              const snapshot = await getExecutorSnapshot({
                workspace_id: paired?.workspace_id || (req.query.workspace_id ? String(req.query.workspace_id) : undefined),
                project_id: paired?.project_id || (req.query.project_id ? String(req.query.project_id) : undefined),
                node_id: paired?.node_id || (req.query.node_id ? String(req.query.node_id) : undefined),
                limit: req.query.limit ? Number(req.query.limit) : undefined,
              });
              res.json({ ok: true, ...snapshot });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.get('/jobs/:job_id', async (req: Request, res: Response) => {
            try {
              const job = await getExecutorJob(req.params.job_id);
              if (!job) {
                res.status(404).json({ ok: false, error: `Executor job ${req.params.job_id} not found` });
                return;
              }
              enforcePairedScope(req, { node_id: job.node_id || undefined, workspace_id: job.workspace_id, project_id: job.project_id });
              res.json({ ok: true, job });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/nodes/register', async (req: Request, res: Response) => {
            try {
              enforcePairedScope(req, { node_id: req.body?.node_id, workspace_id: req.body?.workspace_id, project_id: req.body?.project_id });
              const node = await registerExecutorNode({
                node_id: req.body?.node_id,
                name: req.body?.name,
                workspace_id: req.body?.workspace_id,
                project_id: req.body?.project_id,
                root_label: req.body?.root_label,
                platform: req.body?.platform,
                capabilities: req.body?.capabilities,
              });
              res.status(201).json({ ok: true, node });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/nodes/:node_id/heartbeat', async (req: Request, res: Response) => {
            try {
              enforcePairedScope(req, { node_id: req.params.node_id });
              const node = await heartbeatExecutorNode(req.params.node_id);
              res.json({ ok: true, node });
            } catch (err: any) {
              res.status(404).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/jobs', async (req: Request, res: Response) => {
            try {
              requireController(req);
              const job = await createExecutorJob({
                workspace_id: req.body?.workspace_id,
                project_id: req.body?.project_id,
                node_id: req.body?.node_id,
                task_id: req.body?.task_id,
                action: req.body?.action,
                payload: req.body?.payload,
                created_by: req.body?.created_by || (req as any).auth?.agentName || 'bridge',
              });
              res.status(201).json({ ok: true, job });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/jobs/claim', async (req: Request, res: Response) => {
            try {
              enforcePairedScope(req, { node_id: req.body?.node_id, workspace_id: req.body?.workspace_id, project_id: req.body?.project_id });
              const job = await claimExecutorJob({
                node_id: req.body?.node_id,
                workspace_id: req.body?.workspace_id,
                project_id: req.body?.project_id,
              });
              res.json({ ok: true, job });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/jobs/:job_id/result', async (req: Request, res: Response) => {
            try {
              enforcePairedScope(req, { node_id: req.body?.node_id });
              const job = await completeExecutorJob({
                node_id: req.body?.node_id,
                job_id: req.params.job_id,
                ok: req.body?.ok === true,
                result: req.body?.result,
                error: req.body?.error,
              });
              enforcePairedScope(req, { node_id: job.node_id || undefined, workspace_id: job.workspace_id, project_id: job.project_id });
              res.json({ ok: true, job });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });

          executorRouter.post('/jobs/:job_id/cancel', async (req: Request, res: Response) => {
            try {
              requireController(req);
              const job = await cancelExecutorJob(req.params.job_id);
              res.json({ ok: true, job });
            } catch (err: any) {
              res.status(400).json({ ok: false, error: err.message });
            }
          });
          TS

          cat > tests/executorPairing.test.ts <<'TS'
          import assert from 'node:assert';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {
            issueExecutorPairing,
            redeemExecutorPairing,
            resetExecutorPairingStoreForTests,
            verifyPairedExecutorToken,
          } from '../server/executorPairing.js';

          const tempFile = path.join(os.tmpdir(), `bridge-executor-auth-${process.pid}-${Date.now()}.json`);
          process.env.BRIDGE_EXECUTOR_AUTH_STORE_PATH = tempFile;

          try {
            await resetExecutorPairingStoreForTests();
            const issued = await issueExecutorPairing({ workspace_id: 'workspace-test', project_id: 'project-test' });
            assert.match(issued.code, /^[A-Z2-9]{4}-[A-Z2-9]{4}$/);
            const redeemed = await redeemExecutorPairing({ code: issued.code.toLowerCase(), node_id: 'pc-test-node' });
            assert.strictEqual(redeemed.workspace_id, 'workspace-test');
            assert.strictEqual(redeemed.project_id, 'project-test');
            assert.ok(redeemed.token.startsWith('bex_'));
            assert.deepStrictEqual(verifyPairedExecutorToken(redeemed.token), {
              node_id: 'pc-test-node',
              workspace_id: 'workspace-test',
              project_id: 'project-test',
            });
            assert.strictEqual(verifyPairedExecutorToken('bex_wrong_token_value_123456789'), null);
            await assert.rejects(
              () => redeemExecutorPairing({ code: issued.code, node_id: 'pc-test-node-2' }),
              /invalid or already used/,
            );
            console.log('executorPairing.test.ts passed');
          } finally {
            try { fs.unlinkSync(tempFile); } catch { /* ignore */ }
          }
          TS

          cat > pc-executor/windows-bootstrap.ps1 <<'PS1'
          $ErrorActionPreference = 'Stop'
          $BridgeUrl = if ($env:BRIDGE_URL) { $env:BRIDGE_URL.TrimEnd('/') } else { 'https://bridge-ai-mission-control.ai.studio' }
          $PairCode = if ($env:BRIDGE_PAIR_CODE) { $env:BRIDGE_PAIR_CODE.Trim() } else { Read-Host 'Bridge pairing code' }

          Write-Host ''
          Write-Host '=== Bridge Local Executor ===' -ForegroundColor Cyan
          Write-Host 'This PC will only access the folder you choose.' -ForegroundColor DarkGray

          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host 'Node.js LTS is required.' -ForegroundColor Yellow
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              $answer = Read-Host 'Install Node.js LTS with winget now? [Y/n]'
              if ($answer -notmatch '^[Nn]') {
                winget install OpenJS.NodeJS.LTS --accept-package-agreements --accept-source-agreements
                $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
              }
            }
          }
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            throw 'Node.js was not found. Install Node.js LTS, then run the Bridge setup command again.'
          }

          $ProjectRoot = ''
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $dialog = New-Object System.Windows.Forms.FolderBrowserDialog
            $dialog.Description = 'Choose the ONLY folder Bridge Local Executor may access'
            $dialog.ShowNewFolderButton = $true
            if ($dialog.ShowDialog() -eq [System.Windows.Forms.DialogResult]::OK) { $ProjectRoot = $dialog.SelectedPath }
          } catch {
            $ProjectRoot = Read-Host 'Project root folder (example D:\AIProjects\MyApp)'
          }
          if (-not $ProjectRoot) { throw 'No project folder selected.' }
          $ProjectRoot = [System.IO.Path]::GetFullPath($ProjectRoot)
          if (-not (Test-Path -LiteralPath $ProjectRoot -PathType Container)) { throw "Folder does not exist: $ProjectRoot" }

          $writeAnswer = Read-Host 'Allow AI to WRITE files inside this folder? [y/N]'
          $commandAnswer = Read-Host 'Allow allowlisted test/build/git commands inside this folder? [y/N]'
          $AllowWrites = if ($writeAnswer -match '^[Yy]') { 'true' } else { 'false' }
          $AllowCommands = if ($commandAnswer -match '^[Yy]') { 'true' } else { 'false' }

          $Base = Join-Path $env:LOCALAPPDATA 'BridgeExecutor'
          $App = Join-Path $Base 'app'
          $Zip = Join-Path $Base 'bridge-main.zip'
          $Extract = Join-Path $Base 'extract'
          New-Item -ItemType Directory -Force -Path $Base | Out-Null
          Remove-Item -Recurse -Force $Extract -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $Extract | Out-Null

          Write-Host 'Downloading Bridge Executor...' -ForegroundColor Cyan
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/machxanht/BridgeChatgpt/archive/refs/heads/main.zip' -OutFile $Zip
          Expand-Archive -LiteralPath $Zip -DestinationPath $Extract -Force
          $Source = Get-ChildItem -LiteralPath $Extract -Directory | Select-Object -First 1
          if (-not $Source) { throw 'Could not unpack Bridge Executor.' }
          Remove-Item -Recurse -Force $App -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $Source.FullName -Destination $App
          Remove-Item -Recurse -Force $Extract -ErrorAction SilentlyContinue
          Remove-Item -Force $Zip -ErrorAction SilentlyContinue

          Push-Location $App
          try {
            Write-Host 'Installing local worker dependencies (first setup only)...' -ForegroundColor Cyan
            & npm.cmd ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

            $env:BRIDGE_URL = $BridgeUrl
            $env:BRIDGE_PAIR_CODE = $PairCode
            $env:BRIDGE_PROJECT_ROOT = $ProjectRoot
            $env:BRIDGE_EXECUTOR_ALLOW_WRITES = $AllowWrites
            $env:BRIDGE_EXECUTOR_ALLOW_COMMANDS = $AllowCommands

            $Launcher = Join-Path $Base 'Start Bridge Executor.cmd'
            @"
          @echo off
          title Bridge Local Executor
          cd /d "$App"
          call npm run executor
          pause
          "@ | Set-Content -LiteralPath $Launcher -Encoding ASCII

            Write-Host ''
            Write-Host "Folder locked to: $ProjectRoot" -ForegroundColor Green
            Write-Host "Future launcher: $Launcher" -ForegroundColor DarkGray
            Write-Host 'Pairing and connecting now...' -ForegroundColor Cyan
            & npm.cmd run executor
          } finally {
            Pop-Location
          }
          PS1

          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # pc-executor/index.ts: support one-time browser-issued pairing codes.
          patch('pc-executor/index.ts',
                "const HOST = process.env.BRIDGE_EXECUTOR_HOST || '127.0.0.1';\n",
                "const HOST = process.env.BRIDGE_EXECUTOR_HOST || '127.0.0.1';\nconst PAIR_CODE = String(process.env.BRIDGE_PAIR_CODE || '').trim();\n")

          patch('pc-executor/index.ts',
                "let config = loadConfig();\nlet nodeId = makeNodeId(config);",
                "let config = loadConfig();\nif (PAIR_CODE) {\n  const envRoot = String(process.env.BRIDGE_PROJECT_ROOT || config.projectRoot).trim();\n  config = {\n    ...config,\n    bridgeUrl: String(process.env.BRIDGE_URL || config.bridgeUrl).replace(/\\/+$/, ''),\n    token: '',\n    workspaceId: '',\n    projectId: '',\n    projectRoot: path.resolve(envRoot),\n    allowWrites: process.env.BRIDGE_EXECUTOR_ALLOW_WRITES ? process.env.BRIDGE_EXECUTOR_ALLOW_WRITES === 'true' : config.allowWrites,\n    allowCommands: process.env.BRIDGE_EXECUTOR_ALLOW_COMMANDS ? process.env.BRIDGE_EXECUTOR_ALLOW_COMMANDS === 'true' : config.allowCommands,\n  };\n}\nlet nodeId = makeNodeId(config);")

          patch('pc-executor/index.ts',
                "async function registerNode(force = false) {",
                "async function redeemPairCode() {\n  if (!PAIR_CODE) return;\n  if (!fs.existsSync(config.projectRoot) || !fs.statSync(config.projectRoot).isDirectory()) {\n    throw new Error(`Project root does not exist: ${config.projectRoot}`);\n  }\n  const response = await fetch(`${config.bridgeUrl}/api/executors/pair`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ code: PAIR_CODE, node_id: nodeId }),\n  });\n  const data = await response.json().catch(() => ({}));\n  if (!response.ok) throw new Error(data.error || `Bridge pairing HTTP ${response.status}`);\n  config = {\n    ...config,\n    token: String(data.token || ''),\n    workspaceId: String(data.workspace_id || ''),\n    projectId: String(data.project_id || ''),\n  };\n  if (!config.token || !config.workspaceId || !config.projectId) throw new Error('Bridge pairing returned incomplete credentials');\n  saveConfig(config);\n  appendAudit({ time: new Date().toISOString(), type: 'pairing', ok: true, summary: `Paired ${nodeId} to ${config.workspaceId}/${config.projectId}` });\n}\n\nasync function registerNode(force = false) {")

          patch('pc-executor/index.ts',
                "void workerLoop();",
                "async function startExecutor() {\n  try {\n    await redeemPairCode();\n  } catch (error: any) {\n    connection = 'offline';\n    lastError = error?.message || String(error);\n    console.error(`[Bridge Local Executor] Pairing failed: ${lastError}`);\n  }\n  void workerLoop();\n}\n\nvoid startExecutor();")

          # Main web UI: create pairing code and copy one PowerShell command.
