name: Bridge Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/bridge-wake-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android/bridge-wake-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/bridge-wake-app/app/build/outputs/apk/debug/app-debug.apk bridge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-android-apk
          path: bridge.apk
          if-no-files-found: error
          retention-days: 30
