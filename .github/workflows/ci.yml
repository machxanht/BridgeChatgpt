name: Bridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package Bridge Wake extension
        run: |
          set -euo pipefail
          cd chrome-extension
          zip -qr ../bridge-wake.zip bridge-wake
          test -s ../bridge-wake.zip
      - name: Upload Bridge Wake extension
        uses: actions/upload-artifact@v4
        with:
          name: bridge-wake
          path: bridge-wake.zip
          if-no-files-found: error
          retention-days: 30
      - name: Production startup smoke test
        env:
          NODE_ENV: production
          PORT: 3101
          GITHUB_COMMAND_BUS_ENABLED: "false"
        run: |
          set -euo pipefail
          npm start > /tmp/bridge-start.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health > /tmp/bridge-health.json; then
              cat /tmp/bridge-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/bridge-start.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/bridge-start.log
          exit 1
