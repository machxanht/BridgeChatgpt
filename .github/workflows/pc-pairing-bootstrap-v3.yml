name: Apply PC executor pairing bootstrap v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-pairing-bootstrap-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply pairing feature with JSX fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pc-pairing-bootstrap.yml').read_text()
          start_marker = '      - name: Add secure pairing and Windows bootstrap\n        shell: bash\n        run: |\n'
          start = src.index(start_marker) + len(start_marker)
          end = src.index('\n      - name: Install dependencies', start)
          lines = src[start:end].splitlines()
          shell_lines = [line[10:] if line.startswith('          ') else line for line in lines]
          fixed = []
          for line in shell_lines:
              stripped = line.strip()
              if stripped.startswith('"        {pcMode && (') and stripped.endswith('")'):
                  indent = line[:len(line) - len(line.lstrip())]
                  inner = stripped[1:-2]
                  line = indent + "'''" + inner + "''')"
              fixed.append(line)
          Path('/tmp/apply-pc-pairing.sh').write_text('\n'.join(fixed) + '\n')
          PY
          bash /tmp/apply-pc-pairing.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/LocalExecutorPanel.tsx')
          text = p.read_text()
          bad = 'text-[10.5px] text-muted-foreground`}">'
          if bad not in text:
              raise SystemExit('Expected JSX quote bug anchor not found')
          p.write_text(text.replace(bad, 'text-[10.5px] text-muted-foreground`}>', 1))
          PY
          rm -f .github/workflows/pc-pairing-bootstrap.yml .github/workflows/pc-pairing-bootstrap-v2.yml .github/workflows/pc-pairing-bootstrap-v3.yml
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified feature
        shell: bash
        run: |
          git config user.name "machxanht"
          git config user.email "machxanht@gmail.com"
          git add -A
          git commit -m "feat(executor): pair Windows PC from Bridge web"
          git push origin HEAD:main
