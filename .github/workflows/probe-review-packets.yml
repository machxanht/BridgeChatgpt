name: Probe Bridge Review Packets

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-review-packets.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AI Studio preview cookie challenge
        env:
          BRIDGE_BASE_URL: https://ais-dev-sghukhn46uckog6l7pfzyw-334331188248.asia-east1.run.app
        run: |
          set -euo pipefail
          curl -sS -D /tmp/headers.txt --connect-timeout 15 --max-time 30 -o /tmp/body.html "$BRIDGE_BASE_URL/api/review-packets" || true
          echo '--- headers ---'
          sed -n '1,80p' /tmp/headers.txt
          echo '--- body prefix ---'
          sed -n '1,120p' /tmp/body.html
