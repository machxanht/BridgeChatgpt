name: Probe Bridge Review Packets

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-review-packets.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe deployed review packet endpoint
        env:
          BRIDGE_BASE_URL: https://ais-dev-sghukhn46uckog6l7pfzyw-334331188248.asia-east1.run.app
        run: |
          set -euo pipefail
          mkdir -p bridge-bus/outbox
          code=$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/review-packets.json -w '%{http_code}' "$BRIDGE_BASE_URL/api/review-packets")
          echo "Bridge review packet endpoint HTTP $code"
          test "$code" = "200"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/review-packets.json', 'utf8');
          if (Buffer.byteLength(raw, 'utf8') > 4 * 1024 * 1024) throw new Error('Review packet response too large');
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') throw new Error('Review packet response is not JSON object');
          fs.writeFileSync('bridge-bus/outbox/bridge-review-probe.json', JSON.stringify(parsed, null, 2) + '\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bridge-bus/outbox/bridge-review-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture deployed Bridge review packet probe'
          git pull --rebase origin main
          git push origin HEAD:main
