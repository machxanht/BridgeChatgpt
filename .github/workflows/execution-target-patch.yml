name: Apply execution target selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execution-target-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch execution target support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # server/workspaceRegistry.ts
          patch('server/workspaceRegistry.ts',
          "export type WorkspaceProvider = 'chatgpt' | 'google-ai-studio';\nexport type WorkspaceInstanceStatus = 'active' | 'idle' | 'offline';",
          "export type WorkspaceProvider = 'chatgpt' | 'google-ai-studio';\nexport type WorkspaceInstanceStatus = 'active' | 'idle' | 'offline';\nexport type WorkspaceExecutionTarget = 'pc' | 'studio';")

          patch('server/workspaceRegistry.ts',
          "  branch: string;\n  created_at: string;",
          "  branch: string;\n  execution_target: WorkspaceExecutionTarget;\n  created_at: string;")

          patch('server/workspaceRegistry.ts',
          "function requireId(name: string, value: unknown) {\n  const id = String(value || '').trim();\n  if (!SAFE_ID.test(id)) throw new Error(`${name} must match ${SAFE_ID}`);\n  return id;\n}",
          "function requireId(name: string, value: unknown) {\n  const id = String(value || '').trim();\n  if (!SAFE_ID.test(id)) throw new Error(`${name} must match ${SAFE_ID}`);\n  return id;\n}\n\nfunction normalizeExecutionTarget(value: unknown, fallback: WorkspaceExecutionTarget = 'studio'): WorkspaceExecutionTarget {\n  if (value === 'pc' || value === 'studio') return value;\n  return fallback;\n}")

          patch('server/workspaceRegistry.ts',
          "    branch: project.default_branch || 'main',\n    created_at: now,",
          "    branch: project.default_branch || 'main',\n    execution_target: 'studio',\n    created_at: now,")

          patch('server/workspaceRegistry.ts',
          "    const workspaces = store.workspaces.map(workspace => ({\n      ...workspace,\n      chatgpt_instances:",
          "    const workspaces = store.workspaces.map(workspace => ({\n      ...workspace,\n      execution_target: normalizeExecutionTarget(workspace.execution_target),\n      chatgpt_instances:")

          patch('server/workspaceRegistry.ts',
          "      branch: cleanLabel(input.branch, existing?.branch || project.default_branch || 'main'),\n      created_at: existing?.created_at || now,",
          "      branch: cleanLabel(input.branch, existing?.branch || project.default_branch || 'main'),\n      execution_target: normalizeExecutionTarget(input.execution_target, normalizeExecutionTarget(existing?.execution_target)),\n      created_at: existing?.created_at || now,")

          # server/resourceRegistry.ts
          patch('server/resourceRegistry.ts',
          "    branch: string;\n    studio_targets: ResourceTargetView[];",
          "    branch: string;\n    execution_target: 'pc' | 'studio';\n    studio_targets: ResourceTargetView[];")

          patch('server/resourceRegistry.ts',
          "      branch: workspace.branch,\n      studio_targets: targets.filter(target => target.provider === 'google-ai-studio'),",
          "      branch: workspace.branch,\n      execution_target: workspace.execution_target === 'pc' ? 'pc' : 'studio',\n      studio_targets: targets.filter(target => target.provider === 'google-ai-studio'),")

          # server/resourceRoutes.ts
          patch('server/resourceRoutes.ts',
          "      branch: String(req.body?.branch || '').trim() || 'main',\n    });",
          "      branch: String(req.body?.branch || '').trim() || 'main',\n      execution_target: req.body?.execution_target,\n    });")

          # src/components/ProjectRouterV2.tsx
          patch('src/components/ProjectRouterV2.tsx',
          "  Check,\n  ExternalLink,",
          "  Boxes,\n  Check,\n  ExternalLink,")
          patch('src/components/ProjectRouterV2.tsx',
          "  MoreHorizontal,\n  Pencil,",
          "  MonitorCog,\n  MoreHorizontal,\n  Pencil,")
          patch('src/components/ProjectRouterV2.tsx',
          "  branch: string;\n  studio_targets: ResourceTarget[];",
          "  branch: string;\n  execution_target?: 'pc' | 'studio';\n  studio_targets: ResourceTarget[];")
          patch('src/components/ProjectRouterV2.tsx',
          "  const [newStudio, setNewStudio] = useState('');\n  const [newChatgpt, setNewChatgpt] = useState('');",
          "  const [newStudio, setNewStudio] = useState('');\n  const [newChatgpt, setNewChatgpt] = useState('');\n  const [newExecutionTarget, setNewExecutionTarget] = useState<'pc' | 'studio'>('pc');")
          patch('src/components/ProjectRouterV2.tsx',
          "    setDraftBranch(current.branch || 'main');\n    setDraftTargets([",
          "    setDraftBranch(current.branch || 'main');\n    setDraftTargets([")
          patch('src/components/ProjectRouterV2.tsx',
          "        body: JSON.stringify({ repository_url: newRepo.trim(), project_name: newName.trim() || undefined }),",
          "        body: JSON.stringify({ repository_url: newRepo.trim(), project_name: newName.trim() || undefined, execution_target: newExecutionTarget }),")
          patch('src/components/ProjectRouterV2.tsx',
          "      setNewName(''); setNewRepo(''); setNewStudio(''); setNewChatgpt('');",
          "      setNewName(''); setNewRepo(''); setNewStudio(''); setNewChatgpt(''); setNewExecutionTarget('pc');")
          patch('src/components/ProjectRouterV2.tsx',
          "          branch: draftBranch.trim() || 'main',\n        }),",
          "          branch: draftBranch.trim() || 'main',\n          execution_target: current.execution_target === 'pc' ? 'pc' : 'studio',\n        }),")
          patch('src/components/ProjectRouterV2.tsx',
          "  const openStack = () => {",
          "  const setExecutionTarget = async (executionTarget: 'pc' | 'studio') => {\n    if (!current || busy || (current.execution_target || 'studio') === executionTarget) return;\n    setBusy('execution-target');\n    setFeedback('');\n    try {\n      const response = await fetch('/api/resource-registry/projects', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({\n          workspace_id: current.workspace_id,\n          project_id: current.project_id,\n          project_name: current.project_name,\n          repository_url: current.repository_url,\n          branch: current.branch || 'main',\n          execution_target: executionTarget,\n        }),\n      });\n      const data = await response.json().catch(() => ({}));\n      if (!response.ok) throw new Error(data.error || 'Không đổi được execution target');\n      await load();\n      setFeedback(`✓ Execution target → ${executionTarget === 'pc' ? 'PC Local' : 'AI Studio'}`);\n    } catch (error: any) {\n      setFeedback(`Lỗi: ${error?.message || 'không đổi được execution target'}`);\n    } finally {\n      setBusy('');\n    }\n  };\n\n  const openStack = () => {")

          patch('src/components/ProjectRouterV2.tsx',
          "          <div className=\"grid gap-2 sm:grid-cols-2\">\n            <Field label=\"Project name\" value={newName} onChange={setNewName} />",
          "          <div className=\"grid gap-2 sm:grid-cols-2\">\n            <Field label=\"Project name\" value={newName} onChange={setNewName} />")
          patch('src/components/ProjectRouterV2.tsx',
          "            <Field label=\"ChatGPT conversation URL\" value={newChatgpt} onChange={setNewChatgpt} />\n          </div>\n          <div className=\"mt-3 flex justify-end gap-2\">",
          "            <Field label=\"ChatGPT conversation URL\" value={newChatgpt} onChange={setNewChatgpt} />\n          </div>\n          <div className=\"mt-2 flex items-center gap-2\">\n            <span className=\"text-[10px] font-medium uppercase tracking-[0.12em] text-muted-foreground\">Execution</span>\n            <button onClick={() => setNewExecutionTarget('pc')} className={`inline-flex h-8 items-center gap-1.5 rounded-full border px-3 text-[11px] ${newExecutionTarget === 'pc' ? 'border-human/40 bg-human/10 text-human' : 'border-border text-muted-foreground'}`}><MonitorCog className=\"size-3.5\" /> PC Local</button>\n            <button onClick={() => setNewExecutionTarget('studio')} className={`inline-flex h-8 items-center gap-1.5 rounded-full border px-3 text-[11px] ${newExecutionTarget === 'studio' ? 'border-studio/40 bg-studio/10 text-studio' : 'border-border text-muted-foreground'}`}><Boxes className=\"size-3.5\" /> AI Studio</button>\n          </div>\n          <div className=\"mt-3 flex justify-end gap-2\">")

          patch('src/components/ProjectRouterV2.tsx',
          "                    <span className=\"truncate\">· {shortRepo(current.repository_url)}</span>\n                  </div>\n                </div>\n              </div>",
          "                    <span className=\"truncate\">· {shortRepo(current.repository_url)}</span>\n                  </div>\n                  <div className=\"mt-1 flex items-center gap-1\">\n                    <button disabled={busy === 'execution-target'} onClick={() => setExecutionTarget('pc')} className={`inline-flex h-6 items-center gap-1 rounded-full border px-2 text-[9.5px] font-medium transition-colors ${(current.execution_target || 'studio') === 'pc' ? 'border-human/40 bg-human/10 text-human' : 'border-border text-muted-foreground hover:text-foreground'}`}><MonitorCog className=\"size-3\" /> PC</button>\n                    <button disabled={busy === 'execution-target'} onClick={() => setExecutionTarget('studio')} className={`inline-flex h-6 items-center gap-1 rounded-full border px-2 text-[9.5px] font-medium transition-colors ${(current.execution_target || 'studio') === 'studio' ? 'border-studio/40 bg-studio/10 text-studio' : 'border-border text-muted-foreground hover:text-foreground'}`}><Boxes className=\"size-3\" /> Studio</button>\n                  </div>\n                </div>\n              </div>")

          patch('src/components/ProjectRouterV2.tsx',
          "                {current.studio_targets[0] ? <SessionChip target={current.studio_targets[0]} tone=\"studio\" /> : <Warn>Bind AI Studio workspace</Warn>}\n                {current.chatgpt_targets[0] ? <SessionChip target={current.chatgpt_targets[0]} tone=\"gpt\" /> : <Warn>Bind ChatGPT conversation</Warn>}",
          "                {(current.execution_target || 'studio') === 'pc' ? (\n                  <div className=\"flex min-w-0 items-center gap-2 rounded-lg border border-human/25 bg-human/8 px-2.5 py-1.5\">\n                    <MonitorCog className=\"size-4 shrink-0 text-human\" />\n                    <div className=\"min-w-0\"><div className=\"truncate text-[12px] font-medium\">PC Local Executor</div><div className=\"truncate text-[10px] text-muted-foreground\">Studio optional · root chosen on PC</div></div>\n                  </div>\n                ) : current.studio_targets[0] ? <SessionChip target={current.studio_targets[0]} tone=\"studio\" /> : <Warn>Bind AI Studio workspace</Warn>}\n                {current.chatgpt_targets[0] ? <SessionChip target={current.chatgpt_targets[0]} tone=\"gpt\" /> : <Warn>{(current.execution_target || 'studio') === 'pc' ? 'Bind ChatGPT for natural-language PC tasks' : 'Bind ChatGPT conversation'}</Warn>}")

          # src/components/BridgeChatPanel.tsx
          patch('src/components/BridgeChatPanel.tsx',
          "  Loader2,\n  Sparkles,",
          "  Loader2,\n  MonitorCog,\n  Sparkles,")
          patch('src/components/BridgeChatPanel.tsx',
          "  branch: string;\n  studio_targets: ResourceTarget[];",
          "  branch: string;\n  execution_target?: 'pc' | 'studio';\n  studio_targets: ResourceTarget[];")
          patch('src/components/BridgeChatPanel.tsx',
          "    const newestChat = [...workspace.chatgpt_targets].reverse()[0];\n    return newestChat || workspace.studio_targets[0] || null;",
          "    const newestChat = [...workspace.chatgpt_targets].reverse()[0];\n    if ((workspace.execution_target || 'studio') === 'pc') return newestChat || null;\n    return workspace.studio_targets[0] || newestChat || null;")
          patch('src/components/BridgeChatPanel.tsx',
          "    if (targetId === 'auto') return 'Auto';",
          "    if (targetId === 'auto') return `Auto · ${(workspace?.execution_target || 'studio') === 'pc' ? 'PC' : 'Studio'}`;")
          patch('src/components/BridgeChatPanel.tsx',
          "      setFeedback('Project này chưa có ChatGPT/Studio session để giao việc.');",
          "      setFeedback((workspace.execution_target || 'studio') === 'pc'\n        ? 'PC mode cần bind ChatGPT conversation để xử lý lệnh tự nhiên. Local Executor vẫn dùng được trong System Details.'\n        : 'Project này chưa có AI Studio/ChatGPT session để giao việc.');")
          patch('src/components/BridgeChatPanel.tsx',
          "                <Sparkles className=\"size-3.5\" /> Auto",
          "                {(workspace?.execution_target || 'studio') === 'pc' ? <MonitorCog className=\"size-3.5\" /> : <Sparkles className=\"size-3.5\" />} Auto · {(workspace?.execution_target || 'studio') === 'pc' ? 'PC' : 'Studio'}")
          patch('src/components/BridgeChatPanel.tsx',
          "              {targetId === 'auto' ? <Sparkles className=\"size-3.5\" /> : chooseTarget()?.provider === 'chatgpt' ? <Brain className=\"size-3.5\" /> : <Boxes className=\"size-3.5\" />}",
          "              {targetId === 'auto' ? ((workspace?.execution_target || 'studio') === 'pc' ? <MonitorCog className=\"size-3.5\" /> : <Sparkles className=\"size-3.5\" />) : chooseTarget()?.provider === 'chatgpt' ? <Brain className=\"size-3.5\" /> : <Boxes className=\"size-3.5\" />}")

          # src/components/LocalExecutorPanel.tsx
          patch('src/components/LocalExecutorPanel.tsx',
          "  project_name: string;\n}",
          "  project_name: string;\n  execution_target?: 'pc' | 'studio';\n}")
          patch('src/components/LocalExecutorPanel.tsx',
          "  const onlineNode = useMemo(() => nodes.find(node => node.connection_status === 'online') || null, [nodes]);",
          "  const onlineNode = useMemo(() => nodes.find(node => node.connection_status === 'online') || null, [nodes]);\n  const pcMode = (workspace?.execution_target || 'studio') === 'pc';")
          patch('src/components/LocalExecutorPanel.tsx',
          "          <div className=\"text-[10.5px] text-muted-foreground\">PC worker for {workspace?.project_name || 'active project'}</div>",
          "          <div className=\"text-[10.5px] text-muted-foreground\">PC worker for {workspace?.project_name || 'active project'} · {pcMode ? 'selected' : 'standby'}</div>")
          patch('src/components/LocalExecutorPanel.tsx',
          "              disabled={!onlineNode || !supported || Boolean(busy)}",
          "              disabled={!pcMode || !onlineNode || !supported || Boolean(busy)}")
          patch('src/components/LocalExecutorPanel.tsx',
          "              title={!onlineNode ? 'Connect a PC worker first' : !supported ? 'Enable this capability on the PC web app' : `Queue ${label}`}",
          "              title={!pcMode ? 'Switch this project to PC execution first' : !onlineNode ? 'Connect a PC worker first' : !supported ? 'Enable this capability on the PC worker' : `Queue ${label}`}")

          # tests/workspaceRegistry.test.ts
          patch('tests/workspaceRegistry.test.ts',
          "  assert.strictEqual(initial.workspaces[0].project_id, 'proj-default');",
          "  assert.strictEqual(initial.workspaces[0].project_id, 'proj-default');\n  assert.strictEqual(initial.workspaces[0].execution_target, 'studio');")
          patch('tests/workspaceRegistry.test.ts',
          "    branch: 'main',\n  });\n  assert.strictEqual(second.workspace_id, 'workspace-khmer');",
          "    branch: 'main',\n    execution_target: 'pc',\n  });\n  assert.strictEqual(second.workspace_id, 'workspace-khmer');\n  assert.strictEqual(second.execution_target, 'pc');")

          # Remove one-shot workflow after successful patch so it cannot run again.
          Path('.github/workflows/execution-target-patch.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "machxanht"
          git config user.email "machxanht@gmail.com"
          git add -A
          git commit -m "feat(router): choose PC or Studio execution per project"
          git push origin HEAD:main
