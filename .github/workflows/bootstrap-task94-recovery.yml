name: Bootstrap TASK-94 Recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-task94-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/task94-hardening
          fetch-depth: 0

      - name: Reassemble and validate TASK-94 recovery payload
        run: |
          set -euo pipefail
          cat bridge-recovery/task94/*.part > /tmp/task94-recovery.json
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const crypto = require('crypto');
          const path = require('path');
          const raw = fs.readFileSync('/tmp/task94-recovery.json', 'utf8');
          let packet;
          try {
            packet = JSON.parse(raw);
          } catch (err) {
            console.error('JSON_PARSE_ERROR:', err instanceof Error ? err.message : String(err));
            process.exit(22);
          }
          if (packet.task_id !== 'TASK-94') throw new Error('Unexpected task id');
          const arts = packet.artifacts;
          const expected = new Map([
            ['server/db.ts', { base: '502eee1b45cf9b9583c1c7e3af5b046a73c7c1f6', next: 'bc0e6955b8e55f064f5af613f09e00d2580e131e' }],
            ['server/githubCommandBus.ts', { base: 'bd71536710c4b6f61a25173b1bb121852fc6a860', next: 'd890bee83d69ea55d8ce5f55672dee3c9bc6ede6' }],
            ['tests/bridge.test.ts', { base: 'c1616d751e6a3db4e88dec8071f5d1118743d391', next: 'b303aadba4bb31b14666065e4dde8516192dc966' }],
          ]);
          if (!Array.isArray(arts) || arts.length !== expected.size) throw new Error('Unexpected TASK-94 artifact count');
          for (const a of arts) {
            const exp = expected.get(a.path);
            if (!exp || a.operation !== 'update' || typeof a.content !== 'string' || a.base_sha !== exp.base) {
              throw new Error('Invalid artifact metadata ' + a.path);
            }
            const bytes = Buffer.from(a.content, 'utf8');
            const gitBlob = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
            if (gitBlob !== exp.next) throw new Error(`Recovered content SHA mismatch ${a.path}: ${gitBlob} != ${exp.next}`);
            const current = cp.execFileSync('git', ['rev-parse', `HEAD:${a.path}`], { encoding: 'utf8' }).trim();
            if (current !== exp.base) throw new Error(`Base SHA mismatch ${a.path}: ${current} != ${exp.base}`);
            fs.mkdirSync(path.dirname(a.path), { recursive: true });
            fs.writeFileSync(a.path, a.content, 'utf8');
          }
          NODE

      - name: Verify, test and publish isolated recovery commit
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' server/db.ts server/githubCommandBus.ts tests/bridge.test.ts | sort)"
          test "$changed" = "$expected" || { echo "Unexpected modified files:"; echo "$changed"; exit 21; }
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/db.ts server/githubCommandBus.ts tests/bridge.test.ts
          git rm -r bridge-recovery/task94 .github/workflows/recover-task94.yml
          git commit -m 'fix: durable IDs and command idempotency bootstrap'
          git push origin HEAD:recovery/task94-hardening
