name: Bootstrap TASK-94 Recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-task94-recovery.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/task94-hardening
          fetch-depth: 0

      - name: Reassemble and validate TASK-94 recovery payload
        run: |
          set -euo pipefail
          cat bridge-recovery/task94/*.part > /tmp/task94-recovery.json
          echo '8434ed70ee9a5eddaf8f44f3050af120ddcda6c633f1f15dd969c025cd5ec7ac  /tmp/task94-recovery.json' | sha256sum -c -
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const packet = JSON.parse(fs.readFileSync('/tmp/task94-recovery.json', 'utf8'));
          if (packet.task_id !== 'TASK-94') throw new Error('Unexpected task id');
          const arts = packet.artifacts;
          const wanted = ['server/db.ts', 'server/githubCommandBus.ts', 'tests/bridge.test.ts'];
          if (!Array.isArray(arts) || arts.length !== 3 || wanted.some(x => !arts.some(a => a.path === x))) {
            throw new Error('Unexpected TASK-94 artifact set');
          }
          for (const a of arts) {
            if (!wanted.includes(a.path) || a.operation !== 'update' || typeof a.content !== 'string' || !/^[0-9a-f]{40}$/.test(a.base_sha || '')) {
              throw new Error('Invalid artifact ' + a.path);
            }
            const current = cp.execFileSync('git', ['rev-parse', `HEAD:${a.path}`], { encoding: 'utf8' }).trim();
            if (current !== a.base_sha) throw new Error(`Base SHA mismatch ${a.path}: ${current} != ${a.base_sha}`);
            fs.mkdirSync(path.dirname(a.path), { recursive: true });
            fs.writeFileSync(a.path, a.content, 'utf8');
          }
          NODE

      - name: Verify, test and publish isolated recovery commit
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' server/db.ts server/githubCommandBus.ts tests/bridge.test.ts | sort)"
          test "$changed" = "$expected" || { echo "Unexpected modified files:"; echo "$changed"; exit 21; }
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/db.ts server/githubCommandBus.ts tests/bridge.test.ts
          git rm -r bridge-recovery/task94 .github/workflows/recover-task94.yml
          git commit -m 'fix: durable IDs and command idempotency bootstrap'
          git push origin HEAD:recovery/task94-hardening
