name: Recover TASK-94

on:
  push:
    branches: [recovery/task94-hardening]
    paths: [.github/workflows/recover-task94.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/task94-hardening
      - name: Fetch and validate TASK-94 review packet
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_MCP_TOKEN }}
          BRIDGE_URL: ${{ vars.BRIDGE_BASE_URL || 'https://ais-dev-sghukhn46uckog6l7pfzyw-334331188248.asia-east1.run.app' }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_TOKEN" || { echo 'BRIDGE_MCP_TOKEN secret is missing'; exit 20; }
          curl --fail --silent --show-error -H "Authorization: Bearer $BRIDGE_TOKEN" "$BRIDGE_URL/api/studio-relay/review-packet/TASK-94" -o /tmp/packet.json
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto'); const cp=require('child_process');
          const p=JSON.parse(fs.readFileSync('/tmp/packet.json','utf8'));
          const arts=p.artifacts || p.result?.artifacts || p.packet?.artifacts;
          if(!Array.isArray(arts)) throw new Error('No artifacts array in TASK-94 packet');
          const wanted=['server/db.ts','server/githubCommandBus.ts','tests/bridge.test.ts'];
          if(arts.length!==3 || wanted.some(x=>!arts.some(a=>a.path===x))) throw new Error('Unexpected TASK-94 artifact set');
          for(const a of arts){
            if(a.operation!=='update'||typeof a.content!=='string'||!/^[0-9a-f]{40}$/.test(a.base_sha||'')) throw new Error('Invalid artifact '+a.path);
            const current=cp.execFileSync('git',['rev-parse',`HEAD:${a.path}`],{encoding:'utf8'}).trim();
            if(current!==a.base_sha) throw new Error(`Base SHA mismatch ${a.path}: ${current} != ${a.base_sha}`);
            fs.mkdirSync(require('path').dirname(a.path),{recursive:true}); fs.writeFileSync(a.path,a.content,'utf8');
          }
          NODE
      - name: Verify and commit exactly three files
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' server/db.ts server/githubCommandBus.ts tests/bridge.test.ts | sort)"
          test "$changed" = "$expected" || { echo "Unexpected files:"; echo "$changed"; exit 21; }
          npm install
          npm run lint
          npm test
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/db.ts server/githubCommandBus.ts tests/bridge.test.ts
          git commit -m 'fix: durable IDs and command idempotency bootstrap'
          git push origin HEAD:recovery/task94-hardening
