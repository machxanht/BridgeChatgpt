name: Bridge Wake Hotfix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-single-flight-recovery-hotfix.mjs'
      - '.github/workflows/bridge-wake-hotfix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-wake-hotfix-once
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic hotfix
        run: node .github/scripts/apply-single-flight-recovery-hotfix.mjs

      - name: Inspect patch safety
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production startup smoke
        env:
          NODE_ENV: production
          PORT: 3101
          GITHUB_COMMAND_BUS_ENABLED: 'false'
        run: |
          set -euo pipefail
          npm start > /tmp/bridge-start.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health > /tmp/bridge-health.json; then
              cat /tmp/bridge-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/bridge-start.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/bridge-start.log
          exit 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android 0.5.0 APK
        run: |
          set -euo pipefail
          gradle -p android/bridge-wake-app :app:assembleDebug --stacktrace
          cp android/bridge-wake-app/app/build/outputs/apk/debug/app-debug.apk bridge.apk
          test -s bridge.apk

      - name: Remove one-shot machinery
        run: |
          git rm .github/scripts/apply-single-flight-recovery-hotfix.mjs
          git rm .github/workflows/bridge-wake-hotfix-once.yml

      - name: Commit verified hotfix
        run: |
          set -euo pipefail
          git config user.name 'Bridge ChatGPT'
          git config user.email 'bridge-chatgpt@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(wake): enforce exact-target single-flight recovery'
          git push origin HEAD:main

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-android-apk
          path: bridge.apk
          if-no-files-found: error
          retention-days: 30
