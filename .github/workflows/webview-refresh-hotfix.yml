name: Bridge WebView Refresh Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-webview-refresh.mjs'
      - '.github/workflows/webview-refresh-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-webview-refresh-hotfix
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic patch
        run: node .github/scripts/patch-webview-refresh.mjs

      - name: Verify diff safety
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p android/bridge-wake-app :app:assembleDebug --stacktrace
          cp android/bridge-wake-app/app/build/outputs/apk/debug/app-debug.apk bridge.apk
          test -s bridge.apk

      - name: Remove one-shot machinery
        run: |
          git rm -f .github/scripts/patch-webview-refresh.mjs
          git rm -f .github/workflows/webview-refresh-hotfix.yml

      - name: Commit verified hotfix
        run: |
          set -euo pipefail
          git config user.name 'Bridge ChatGPT'
          git config user.email 'bridge-chatgpt@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(android): refresh published Bridge WebView'
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-android-apk
          path: bridge.apk
          if-no-files-found: error
          retention-days: 30
