<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghe Ngo 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06151c;color:#fff;font-family:system-ui}canvas{display:block}.hud{position:fixed;z-index:5;left:12px;top:12px;background:#06151cdd;border:1px solid #ffffff33;padding:10px 12px;border-radius:12px}.hud b{color:#ffd34e}.hud small{display:block;color:#bdd0d8;margin-top:3px}</style></head><body><div class="hud"><b>GHE NGO KHMER — 3D</b><small>Kéo để xoay · vuốt 2 ngón để zoom</small></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06151c);scene.fog=new THREE.Fog(0x06151c,38,75);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,160);camera.position.set(18,10,24);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.minDistance=8;controls.maxDistance=55;
scene.add(new THREE.HemisphereLight(0xc8edff,0x18230f,1.8));const sun=new THREE.DirectionalLight(0xffdfaa,2.6);sun.position.set(10,15,8);scene.add(sun);
const water=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x15525d,roughness:.5,metalness:.05}));water.rotation.x=-Math.PI/2;water.position.y=-1.35;scene.add(water);
const boat=new THREE.Group();scene.add(boat);boat.rotation.y=-.08;
const red=new THREE.MeshStandardMaterial({color:0xb8141c,roughness:.38});const gold=new THREE.MeshStandardMaterial({color:0xf5bd24,metalness:.2,roughness:.32});const green=new THREE.MeshStandardMaterial({color:0x138b45,roughness:.38});const dark=new THREE.MeshStandardMaterial({color:0x1a1210,roughness:.55});const wood=new THREE.MeshStandardMaterial({color:0xa85d24,roughness:.55});
const L=27,segs=64;
for(let i=0;i<segs;i++){const t=(i+.5)/segs,x=(t-.5)*L,e=Math.abs(t-.5)*2;const w=.88*(1-.73*Math.pow(e,3));const rise=2.45*Math.pow(e,5);const m=new THREE.Mesh(new THREE.BoxGeometry(L/segs+.018,.78,w),red);m.position.set(x,rise-.55,0);m.rotation.z=(t<.5?-1:1)*Math.pow(e,4)*.30;boat.add(m)}
const inner=new THREE.Mesh(new THREE.BoxGeometry(21.8,.15,.74),dark);inner.position.y=.02;boat.add(inner);
for(const side of [-1,1]){const rail=new THREE.Mesh(new THREE.BoxGeometry(22.6,.11,.07),gold);rail.position.set(0,.12,side*.48);boat.add(rail);const stripe=new THREE.Mesh(new THREE.BoxGeometry(22,.09,.025),green);stripe.position.set(0,-.18,side*.445);boat.add(stripe)}
for(let x=-10;x<=10;x+=.68){const bench=new THREE.Mesh(new THREE.BoxGeometry(.10,.10,1.03),wood);bench.position.set(x,.24,0);boat.add(bench)}
for(const side of [-1,1])for(let x=-11;x<=11;x+=.62){const d=new THREE.Mesh(new THREE.OctahedronGeometry(.19,0),Math.round((x+11)/.62)%2?gold:green);d.scale.set(1.45,.7,.18);d.position.set(x,-.43,side*.44);boat.add(d)}
// Naga-inspired prow
const head=new THREE.Group();head.position.set(13.35,1.75,0);boat.add(head);const neck=new THREE.Mesh(new THREE.ConeGeometry(.42,2.2,7),green);neck.rotation.z=-Math.PI/2;head.add(neck);const crown=new THREE.Mesh(new THREE.ConeGeometry(.34,1.25,5),gold);crown.position.set(-.35,.65,0);crown.rotation.z=-.28;head.add(crown);for(const z of [-.3,.3]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,14,10),new THREE.MeshStandardMaterial({color:0xffffff}));eye.position.set(.38,.16,z);head.add(eye);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),dark);pupil.position.set(.44,.17,z*1.05);head.add(pupil)}
const tail=new THREE.Mesh(new THREE.ConeGeometry(.43,2.3,5),gold);tail.position.set(-13.25,1.72,0);tail.rotation.z=Math.PI/2;boat.add(tail);
// paddles
for(let x=-9.5;x<9.8;x+=1.25)for(const side of [-1,1]){const p=new THREE.Group();const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,2.15,7),wood);shaft.rotation.z=.58;p.add(shaft);const blade=new THREE.Mesh(new THREE.BoxGeometry(.23,.68,.045),gold);blade.position.set(.56,-.88,0);blade.rotation.z=.58;p.add(blade);p.position.set(x,.25,side*.76);p.rotation.x=side*.28;boat.add(p)}
const glow=new THREE.PointLight(0x35c5ff,10,15);glow.position.set(0,-.5,0);scene.add(glow);
function loop(t){requestAnimationFrame(loop);water.material.color.setHSL(.52,.56,.19+Math.sin(t*.0006)*.012);controls.update();renderer.render(scene,camera)}loop(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
