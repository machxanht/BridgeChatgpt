<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghe Ngo Khmer 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071a20;font-family:system-ui;color:#fff}canvas{display:block}.hud{position:fixed;z-index:4;left:12px;top:12px;background:#07151ddd;border:1px solid #ffffff30;padding:10px 13px;border-radius:13px;backdrop-filter:blur(8px)}.hud b{color:#ffd438}.hud small{display:block;color:#c8d8dd;margin-top:3px}.tag{position:fixed;right:10px;bottom:10px;background:#0009;padding:7px 10px;border-radius:9px;font-size:11px}</style></head><body><div class="hud"><b>GHE NGO KHMER — SMOOTH HULL</b><small>Kéo xoay · pinch/scroll zoom · hoa văn Khmer cách điệu</small></div><div class="tag">BridgeChatgpt · Sol 3D study</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071a20);scene.fog=new THREE.Fog(0x071a20,42,90);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,180);camera.position.set(19,8.5,25);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.2,0);controls.minDistance=7;controls.maxDistance=55;scene.add(new THREE.HemisphereLight(0xc9f2ff,0x17200c,1.7));const key=new THREE.DirectionalLight(0xffe4b5,3);key.position.set(9,14,11);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x55cfff,1.4);rim.position.set(-12,6,-10);scene.add(rim);
const water=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x17606a,roughness:.38,metalness:.08}));water.rotation.x=-Math.PI/2;water.position.y=-1.45;scene.add(water);
const boat=new THREE.Group();boat.rotation.y=-.06;scene.add(boat);const red=new THREE.MeshStandardMaterial({color:0xb40e19,roughness:.32,metalness:.04,side:THREE.DoubleSide});const gold=new THREE.MeshStandardMaterial({color:0xffc928,roughness:.27,metalness:.22});const green=new THREE.MeshStandardMaterial({color:0x12a04b,roughness:.32});const black=new THREE.MeshStandardMaterial({color:0x17100d,roughness:.48});const wood=new THREE.MeshStandardMaterial({color:0x8d4c20,roughness:.5});
// Continuous parametric hull: one indexed surface, smooth normals
const NX=128,NY=10,L=29,verts=[],idx=[];function profile(t){const e=Math.abs(t*2-1);return {x:(t-.5)*L,w:.98*Math.pow(Math.sin(Math.PI*t),.34),rise:2.8*Math.pow(e,6)-.18};}
for(let i=0;i<=NX;i++){const t=i/NX,p=profile(t);for(let j=0;j<=NY;j++){const a=-Math.PI*.05+(Math.PI*1.10)*(j/NY);const z=Math.cos(a)*p.w;const bowl=Math.sin(a);const y=p.rise-.18-.88*bowl;verts.push(p.x,y,z)}}for(let i=0;i<NX;i++)for(let j=0;j<NY;j++){const a=i*(NY+1)+j,b=a+NY+1;idx.push(a,b,a+1,b,b+1,a+1)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const hull=new THREE.Mesh(geo,red);hull.castShadow=true;boat.add(hull);
// dark interior floor
const floorShape=new THREE.Shape();floorShape.moveTo(-11,-.35);floorShape.quadraticCurveTo(0,-.7,11,-.35);floorShape.lineTo(11,.35);floorShape.quadraticCurveTo(0,.05,-11,.35);floorShape.closePath();const floor=new THREE.Mesh(new THREE.ShapeGeometry(floorShape),black);floor.rotation.x=-Math.PI/2;floor.position.y=-.34;boat.add(floor);
// rails follow hull curve using tubes
function curveRail(side,yoff,mat){const pts=[];for(let i=3;i<=NX-3;i+=3){const t=i/NX,p=profile(t);pts.push(new THREE.Vector3(p.x,p.rise+yoff,side*p.w*.98))}const c=new THREE.CatmullRomCurve3(pts);const m=new THREE.Mesh(new THREE.TubeGeometry(c,180,.045,7,false),mat);boat.add(m)}curveRail(1,.02,gold);curveRail(-1,.02,gold);curveRail(1,-.25,green);curveRail(-1,-.25,green);
// benches
for(let x=-10.6;x<=10.6;x+=.68){const t=x/L+.5,p=profile(t);const b=new THREE.Mesh(new THREE.BoxGeometry(.085,.075,p.w*1.8),wood);b.position.set(x,p.rise+.08,0);boat.add(b)}
// crisp Khmer-inspired painted ornament: flat discs/teardrops hugging side surface
function ornament(side){for(let x=-11.7,n=0;x<=11.7;x+=.72,n++){const t=x/L+.5,p=profile(t),z=side*(p.w+.018),y=p.rise-.43;const ring=new THREE.Mesh(new THREE.TorusGeometry(.19,.052,7,18),n%2?gold:green);ring.position.set(x,y,z);ring.rotation.x=Math.PI/2;ring.scale.set(1.45,.78,1);boat.add(ring);const petal=new THREE.Mesh(new THREE.CircleGeometry(.095,12),n%2?green:gold);petal.position.set(x+.18,y+.02,z+side*.012);petal.rotation.y=side*Math.PI/2;petal.scale.set(1.6,.7,1);boat.add(petal)}// diagonal border bands
for(let x=-10.8;x<10.8;x+=1.45){const t=x/L+.5,p=profile(t);const band=new THREE.Mesh(new THREE.BoxGeometry(.55,.065,.025),gold);band.position.set(x,p.rise-.12,side*(p.w+.025));band.rotation.z=.62;boat.add(band)}}ornament(1);ornament(-1);
// sculptural Naga-like prow, layered curves
const prow=new THREE.Group();prow.position.set(14.1,2.35,0);boat.add(prow);const neckCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-1.1,-.9,0),new THREE.Vector3(-.5,-.1,0),new THREE.Vector3(.05,.38,0),new THREE.Vector3(.55,.48,0)]);const neck=new THREE.Mesh(new THREE.TubeGeometry(neckCurve,35,.30,10,false),green);prow.add(neck);const muzzle=new THREE.Mesh(new THREE.ConeGeometry(.34,1.15,8),green);muzzle.rotation.z=-Math.PI/2;muzzle.position.set(.88,.47,0);prow.add(muzzle);for(let k=0;k<4;k++){const crest=new THREE.Mesh(new THREE.ConeGeometry(.18+.025*k,.65+.1*k,5),gold);crest.position.set(-.35-.27*k,.58+.18*k,0);crest.rotation.z=-.28;prow.add(crest)}for(const s of [-1,1]){const eyeWhite=new THREE.Mesh(new THREE.SphereGeometry(.105,16,12),new THREE.MeshStandardMaterial({color:0xffffff}));eyeWhite.position.set(.62,.62,s*.27);prow.add(eyeWhite);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),black);pupil.position.set(.68,.63,s*.31);prow.add(pupil)}
// high curved stern fin
const sternCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-13.8,1.6,0),new THREE.Vector3(-14.3,2.3,0),new THREE.Vector3(-14.45,3.4,0),new THREE.Vector3(-14.1,4.15,0)]);const stern=new THREE.Mesh(new THREE.TubeGeometry(sternCurve,30,.16,8,false),gold);boat.add(stern);for(let k=0;k<3;k++){const fin=new THREE.Mesh(new THREE.ConeGeometry(.17,.9,5),k%2?green:gold);fin.position.set(-14.2-k*.05,3.1+k*.45,0);fin.rotation.z=.15;boat.add(fin)}
// paddles
for(let x=-9.8;x<10;x+=1.35)for(const side of [-1,1]){const t=x/L+.5,pf=profile(t);const g=new THREE.Group();const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.026,.026,2.25,8),wood);shaft.rotation.z=.55;g.add(shaft);const blade=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,5,8),gold);blade.scale.set(1,.45,.32);blade.position.set(.58,-.92,0);blade.rotation.z=.55;g.add(blade);g.position.set(x,pf.rise+.16,side*(pf.w+.3));g.rotation.x=side*.30;boat.add(g)}
// subtle reflection light
const glow=new THREE.PointLight(0x25d8ff,12,18);glow.position.set(0,-.8,0);scene.add(glow);function loop(t){requestAnimationFrame(loop);water.material.color.setHSL(.52,.58,.20+Math.sin(t*.00055)*.012);controls.update();renderer.render(scene,camera)}loop(0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
